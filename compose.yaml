name: observable-task-pipeline

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipeline
      POSTGRES_USER: pipeline
      POSTGRES_PASSWORD: pipeline
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline -d pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db:5432/pipeline
      ARTIFACT_DIR: /artifacts
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - artifacts:/artifacts
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: ["python", "-m", "pipeline.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://pipeline:pipeline@db:5432/pipeline
      ARTIFACT_DIR: /artifacts
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - artifacts:/artifacts

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    ports:
      - "5174:5173"

volumes:
  postgres_data:
  artifacts:
